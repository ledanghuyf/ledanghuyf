<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Lê Đăng Huy, Web Developer, sinh viên Công nghệ Thông tin Đại học Trà Vinh">
<style>
  .drift1{animation:drift 46s linear infinite}.drift2{animation:drift 70s linear infinite;animation-delay:-30s}.drift3{animation:drift 58s linear infinite;animation-delay:-12s}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
  .rays{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .stars circle{animation:tw 3.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .card{animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
