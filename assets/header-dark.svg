.rays{animation:spin 32s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.stars circle,.lamp{animation:tw 3.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
