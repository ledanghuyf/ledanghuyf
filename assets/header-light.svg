<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Lê Đăng Huy, Web Developer, sinh viên Công nghệ Thông tin Đại học Trà Vinh">
<style>
  .drift1{animation:drift 46s linear infinite}.drift2{animation:drift 70s linear infinite;animation-delay:-30s}.drift3{animation:drift 58s linear infinite;animation-delay:-12s}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
  .rays{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .stars circle{animation:tw 3.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .card{animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f86de"/><stop offset=".6" stop-color="#5aa9ef"/><stop offset="1" stop-color="#a9d6fb"/></linearGradient>
<filter id="sh" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06213f" flood-opacity=".45"/></filter><clipPath id="r"><rect width="1200" height="340" rx="18"/></clipPath></defs>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="url(#sky)"/>
<g transform="translate(1085 72)"><g class="rays"><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(0)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(30)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(60)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(90)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(120)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(150)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(180)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(210)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(240)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(270)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(300)"/><rect x="-3" y="-66" width="6" height="18" rx="3" fill="#ffe7a3" transform="rotate(330)"/></g><circle r="38" fill="#ffd45c"/><circle r="52" fill="#ffd45c" opacity=".22"/></g>
<g class="drift1"><g transform="translate(0 40) scale(1.1)" opacity="0.42"><path d="M25 60 a25 25 0 0 1 8-48 a32 32 0 0 1 60-6 a26 26 0 0 1 38 22 a20 20 0 0 1-6 32 z" fill="#fff"/></g></g>
<g class="drift2"><g transform="translate(0 200) scale(1.6)" opacity="0.34"><path d="M25 60 a25 25 0 0 1 8-48 a32 32 0 0 1 60-6 a26 26 0 0 1 38 22 a20 20 0 0 1-6 32 z" fill="#fff"/></g></g>
<g class="drift3"><g transform="translate(0 120) scale(0.8)" opacity="0.38"><path d="M25 60 a25 25 0 0 1 8-48 a32 32 0 0 1 60-6 a26 26 0 0 1 38 22 a20 20 0 0 1-6 32 z" fill="#fff"/></g></g>
<g filter="url(#sh)"><text x="64" y="112" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#eaf5ff">Xin chào, mình là</text>
<text x="62" y="176" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#fff">Lê Đăng Huy</text>
<text x="64" y="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#fff">Web Developer<tspan class="cur" fill="#eaf5ff"> ▍</tspan></text>
<text x="64" y="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#eaf5ff">Sinh viên Công nghệ Thông tin · Đại học Trà Vinh · DA23TTA</text></g>
<g class="card"><g transform="translate(790 92)">
  <rect width="250" height="176" rx="22" fill="#ffffff" fill-opacity="0.22" stroke="#fff" stroke-opacity=".45"/>
  <text x="24" y="38" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#fff">Vĩnh Long</text>
  <text x="24" y="104" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="300" fill="#fff">31°</text>
  <text x="24" y="134" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#fff">Nhiều nắng · đang code</text>
  <text x="24" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#eaf5ff">C:33°  T:25°</text>
</g></g>
</g></svg>