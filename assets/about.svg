<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Đang học: kiểm thử tự động với Playwright, làm việc với RESTful API. Thích làm: giao diện web gọn, dễ dùng trên điện thoại. Hỏi mình về: HTML, CSS, JavaScript, Bootstrap và gọi API bằng fetch.">
<style>.t{animation:up .8s ease-out both}.t1{animation-delay:.15s}.t2{animation-delay:.3s}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
