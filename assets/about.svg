<text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#fff"><tspan x="28" y="98">HTML, CSS, JavaScript,</tspan><tspan x="28" y="130">Bootstrap và gọi API</tspan><tspan x="28" y="162">bằng fetch.</tspan></text>
