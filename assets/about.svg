<text x="60" y="46" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#9fb6d6" letter-spacing="1.5">ĐANG HỌC</text>
<text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#fff"><tspan x="28" y="98">Kiểm thử tự động</tspan><tspan x="28" y="130">với Playwright,</tspan><tspan x="28" y="162">làm việc với RESTful API.</tspan></text>
</g></g><g class="t t1"><g transform="translate(407 0)">
<rect width="386" height="210" rx="22" fill="url(#tg)"/><rect width="386" height="210" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
