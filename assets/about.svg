<text x="60" y="46" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#9fb6d6" letter-spacing="1.5">THÍCH LÀM</text>
<text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#fff"><tspan x="28" y="98">Giao diện web gọn,</tspan><tspan x="28" y="130">dễ dùng trên điện thoại,</tspan><tspan x="28" y="162">chạy nhanh và ít lỗi.</tspan></text>
